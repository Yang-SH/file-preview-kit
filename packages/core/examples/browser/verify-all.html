<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>file-preview-kit 全功能验证台</title>
<!-- 重库裸导入解析：dist 产物按方案 §9 以 bare-specifier 动态导入这些依赖，
     静态伺服场景由 importmap 映射到 CDN（§16.5 已知边界的标准解法）。
     断言用例与离线单文件版共用同一模块 verify-cases.mjs（单一真相源）。 -->
<script type="importmap">
{
  "imports": {
    "@file-preview/core": "/packages/core/dist/index.js",
    "@file-preview/plugin-pdf": "/packages/plugin-pdf/dist/index.js",
    "@file-preview/plugin-office": "/packages/plugin-office/dist/index.js",
    "@file-preview/plugin-archive": "/packages/plugin-archive/dist/index.js",
    "fflate": "https://esm.sh/fflate@0.8.3",
    "papaparse": "https://esm.sh/papaparse@5.6.0",
    "markdown-it": "https://esm.sh/markdown-it@15.0.0",
    "fast-xml-parser": "https://esm.sh/fast-xml-parser@5.11.0",
    "emailjs-mime-parser": "https://esm.sh/emailjs-mime-parser@2.0.7",
    "mediainfo.js": "https://esm.sh/mediainfo.js@0.3.1",
    "mammoth": "https://esm.sh/mammoth@1.12.1",
    "exceljs": "https://esm.sh/exceljs@4.4.0"
  }
}
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 960px; color: #222; }
  h1 { font-size: 1.25rem; } h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0; }
  #summary { font-weight: 700; padding: .5rem .75rem; border-radius: 6px; background: #f0f3f7; }
  .case { display: flex; gap: .6rem; align-items: baseline; padding: .2rem 0; border-bottom: 1px dashed #eee; }
  .badge { min-width: 52px; text-align: center; border-radius: 4px; font-size: .78rem; padding: .05rem .3rem; }
  .pass .badge { background: #d9f2e0; color: #0a7d32; } .fail .badge { background: #fde0e0; color: #c62828; }
  .detail { color: #555; font-size: .82rem; font-family: ui-monospace, monospace; word-break: break-all; }
  file-preview { display: block; min-height: 180px; border: 1px dashed #bbb; border-radius: 6px; padding: .5rem; }
  button { padding: .3rem .8rem; cursor: pointer; }
  code { background: #f0f3f7; padding: 0 .3em; border-radius: 3px; }
</style>
</head>
<body>
<h1>file-preview-kit 全功能验证台</h1>
<div id="summary">运行中…</div>

<section>
  <h2>A · 程序化断言矩阵（21 项 · 与离线单文件版共用 verify-cases.mjs）</h2>
  <div id="cases"></div>
</section>

<section>
  <h2>B · Web Component 手动体验（&lt;file-preview&gt; 零构建默认集，dispatch:'worker'）</h2>
  <p>拖任意文件进下方区域，或 <input type="file" id="pick" /> 或 <button id="demo-png">载入示例 PNG</button>。
     提示：<code>媒体(wav/mp4)</code> 的 WASM 资产仅在 A 区程序化注入，B 区拖入媒体将走错误降级展示。</p>
  <file-preview id="wc"></file-preview>
  <div id="wc-out" class="detail"></div>
</section>

<script type="module" src="/packages/core/dist/browser.js"></script>
<script type="module">
const $ = (s) => document.querySelector(s);
const core = await import('@file-preview/core');
const pdfMod = await import('@file-preview/plugin-pdf');
const officeMod = await import('@file-preview/plugin-office');
const zipMod = await import('@file-preview/plugin-archive');
const { runVerifyCases } = await import('/packages/core/examples/browser/verify-cases.mjs');

// ---------- A 区：断言矩阵（逻辑在共享模块） ----------
const report = await runVerifyCases({
  core, pdfMod, officeMod, zipMod,
  wasmUrl: '/packages/core/examples/browser/assets/MediaInfoModule.wasm',
  workerUrl: '/packages/core/dist/worker.js',
});
for (const c of report.cases) {
  const div = document.createElement('div');
  div.className = 'case ' + (c.pass ? 'pass' : 'fail');
  div.innerHTML = '<span class="badge"></span><b></b><span class="detail"></span>';
  div.querySelector('.badge').textContent = c.pass ? 'PASS' : 'FAIL';
  div.querySelector('b').textContent = c.name;
  div.querySelector('.detail').textContent = c.detail;
  $('#cases').appendChild(div);
}
const ok = report.fail === 0;
const summary = $('#summary');
summary.textContent = (ok ? '✅ 全部通过' : '❌ 存在失败') + '：' + report.pass + '/' + (report.pass + report.fail);
summary.style.background = ok ? '#d9f2e0' : '#fde0e0';
window.__FPK_VERIFY__ = report;

// ---------- B 区：Web Component ----------
$('#demo-png').onclick = async () => {
  const res = await fetch('/packages/core/examples/browser/fixtures/logo.png');
  await wc.preview(new File([await res.blob()], 'logo.png', { type: 'image/png' }));
};
$('#pick').onchange = (e) => { const f = e.target.files[0]; if (f) wc.preview(f); };
const wc = $('#wc');
wc.addEventListener('dragover', (e) => e.preventDefault());
wc.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) $('#wc-out').textContent = `已投递: ${f.name} (${f.size}B)`;
  wc.preview(f);
});
</script>
</body>
</html>
